:root{--wine:#7a1834;--ink:#242020;--pink:#f7e8e9;--paper:#ffffff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,a{cursor:pointer}button{font:inherit}.top{display:flex;justify-content:space-between;gap:12px;padding:19px 5vw;border-bottom:1px solid #e3d8d8;font-size:11px;letter-spacing:.12em}.top b{color:var(--wine)}main{max-width:1370px;margin:auto;padding:40px 5vw 80px}h1{font-size:clamp(54px,9vw,130px);letter-spacing:-.085em;line-height:.86;margin:0 0 36px;font-weight:750}h1 em{font-style:normal;color:var(--wine)}.stage{position:relative;min-height:790px;border:1px solid #e9d9d9;background:#fff;overflow:hidden;border-radius:5px}.stage-label{position:absolute;top:24px;left:26px;font-size:11px;letter-spacing:.13em;color:var(--wine)}.polaroid{position:absolute;left:50%;top:145px;width:min(350px,38vw);padding:12px 12px 45px;background:white;box-shadow:0 18px 38px #441c2829;transform:translateX(-50%) rotate(-5deg);z-index:3;transition:transform .4s;cursor:default}.polaroid:hover,.stage:focus-within .polaroid{transform:translateX(-50%) rotate(-2deg) scale(1.02)}.polaroid img{width:100%;display:block;aspect-ratio:1/1.08;object-fit:cover}.polaroid .cap{font-size:12px;letter-spacing:.07em;text-align:center;margin-top:14px}.tape{position:absolute;top:-17px;left:34%;width:112px;height:34px;transform:rotate(8deg);background:repeating-linear-gradient(90deg,#e9d2adab 0 2px,#f4e1bbac 2px 4px);clip-path:polygon(3% 0,100% 3%,97% 100%,0 95%);z-index:4}.peek{position:absolute;width:clamp(135px,16vw,215px);border:0;padding:7px 7px 28px;background:#fff;box-shadow:0 9px 24px #4e22312e;text-align:left;color:var(--wine);opacity:.05;filter:blur(2px);pointer-events:none;transition:opacity .3s,filter .3s,transform .3s;z-index:5}.stage:hover .peek,.stage:focus-within .peek,.stage.show .peek{opacity:1;filter:none;pointer-events:auto}.peek:hover{z-index:7!important;transform:rotate(0deg) scale(1.13)!important}.peek i ;display:block;transition:transform .2s}.song:hover{transform:translateY(-7px)}.song img{width:100%;aspect-ratio:1;object-fit:cover;display:block;box-shadow:7px 8px 0 #e8d8da}.song .meta{padding-top:18px;display:flex;justify-content:space-between;gap:12px}.song .num{font-size:11px;color:var(--wine);letter-spacing:.1em}.song strong{display:block;font-size:clamp(21px,2.4vw,35px);letter-spacing:-.055em;line-height:1.1;margin:7px 0}.song .artist{font-size:12px}.song .arrow{color:var(--wine);font-size:24px}.bottom{padding:30px 5vw;border-top:1px solid #e6d8d8;font-size:11px;color:#77636a}.hint{font-size:12px;color:#7b6870}@media(max-width:850px){.stage{min-height:770px}.polaroid{top:235px;width:240px}.peek{width:135px}.peek img{height:92px}.p1{left:5%;top:80px}.p2{left:3%;top:260px}.p3{left:7%;bottom:80px}.p4{right:5%;top:80px}.p5{right:3%;top:260px}.p6{right:7%;bottom:80px}.panel{grid-template-columns:1fr;gap:20px}.panel img{max-height:48vh}.panel .pics:not(.multi) img[src*="office-new"]{width:auto;max-width:100%;max-height:65vh;object-fit:contain;box-shadow:8px 9px 0 #f1e5e4}.panel .pics.multi img{max-height:35vh}.songs{gap:12px}}@media(max-width:520px){main{padding:40px 14px 65px}h1{font-size:clamp(47px,12vw,70px)}.stage{min-height:800px}.polaroid{top:265px;width:190px}.peek{width:115px;padding:5px 5px 22px}.peek img{height:85px}.peek span{font-size:8px;padding-top:5px}.p1{top:75px;left:4%}.p2{top:230px;left:3%}.p3{bottom:70px;left:5%}.p4{top:75px;right:4%}.p5{top:230px;right:3%}.p6{bottom:70px;right:5%}.songs{grid-template-columns:1fr 1fr}.song strong{font-size:21px}.reveal{padding:65px 17px 25px}.panel h2{font-size:43px}.panel p{font-size:15px}.stage-label{left:14px;top:15px}}

</style></head><body><main><h1>A LITTLE<br>MORE <em>ABOUT ME.</em></h1><section class="stage" id="stage"><div class="stage-label">HOVER TO EXPLORE · CLICK TO DISCOVER ↗</div><div class="polaroid" id="portrait"><span class="tape"></span><img src="assets/portrait.jpg" alt="Clara at the windmills"><div class="cap">CLARA, OUT OF OFFICE ♡</div></div><button class="peek p1" data-topic="cinema"><img src="assets/film1.jpg" alt="Cinema"><span>FILMS & RED ↗</span></button><button class="peek p2" data-topic="cat"><img src="assets/cat.jpg" alt="Clara with a cat"><span>CAT PERSON ♡</span></button><button class="peek p3" data-topic="bierzo"><img src="assets/bierzo.jpg" alt="El Bierzo"><span>BACK HOME ↗</span></button><button class="peek p4" data-topic="waffles"><img src="assets/waffles.jpg" alt="Stroopwafels"><span>STROOPWAFEL OBSESSION</span></button><button class="peek p6" data-topic="office"><img src="assets/office-new.png" alt="The Office"><span>THAT WOULD BE ME ↗</span></button></section><section class="music"><div class="eyebrow">MY CREATIVE SOUNDTRACK</div><h2>3 SONGS<br>I DESIGN TO ↗</h2><div class="songs"><a class="song" href="https://open.spotify.com/search/World%20Hold%20On%20Bob%20Sinclar" target="_blank" rel="noopener"><img src="assets/song1.png" alt="World Hold On artwork"><div class="meta"><div><strong>WORLD, HOLD ON</strong><span class="artist">BOB SINCLAR</span></div><span class="arrow">↗</span></div></a><a class="song" href="https://open.spotify.com/search/My%20Barn%20My%20Rules" target="_blank" rel="noopener"><img src="assets/song2.png" alt="My Barn My Rules artwork"><div class="meta"><div><strong>MY BARN MY RULES</strong><span class="artist">MCR-T & HORSEGIIRL</span></div><span class="arrow">↗</span></div></a><a class="song" href="https://open.spotify.com/search/The%20Look%20Metronomy" target="_blank" rel="noopener"><img src="assets/song3.png" alt="The Look artwork"><div class="meta"><div><strong>THE LOOK</strong><span class="artist">METRONOMY</span></div><span class="arrow">↗</span></div></a></div><p class="hint">CLICK A COVER TO LISTEN ON SPOTIFY ↗</p></section></main><div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle"><button class="close" id="close">CLOSE ✕</button><div class="panel"><div id="revealImg"></div><div><div class="eyebrow" id="revealIndex"></div><h2 id="revealTitle"></h2><p id="revealText"></p><a class="link" id="revealLink" target="_blank" rel="noopener" hidden></a></div></div></div><script>
const topics={cinema:{n:'CINEMA',title:'ALSO, I LIKE RED.',text:'Three films I love. The colour palette is apparently not a coincidence.',images:['film1.jpg','film2.jpg','film3.jpg'],link:'https://letterboxd.com/clarafergar6/',label:'MY LETTERBOXD ↗'},cat:{n:'CAT PERSON',title:'CAT PERSON. VERY MUCH.',text:'I have a huge collection of little cat figurines. Please don’t think I’m a weirdo.',images:['cat.jpg']},bierzo:{n:'BACK HOME',title:'MADE IN EL BIERZO.',text:'From a small town in northern Spain. Always curious about what is out there.',images:['bierzo.jpg']},waffles:{n:'LITTLE OBSESSIONS',title:'WAY TOO INTO STROOPWAFELS.',text:'One of the reasons I want to move to the Netherlands.',images:['waffles.jpg']},office:{n:'THE OFFICE',title:'THAT WOULD BE ME.',text:'If you hire me.',images:['office-new.png']}};
const reveal=document.querySelector('#reveal');function openTopic(key){let t=topics[key];if(!t)return;if(window.parent!==window){window.parent.postMessage({type:'clara-about-story',topic:t},'*');return;}document.querySelector('#revealIndex').textContent=t.n;document.querySelector('#revealTitle').textContent=t.title;document.querySelector('#revealText').textContent=t.text;document.querySelector('#revealImg').innerHTML='<div class="pics '+(t.images.length>1?'multi':'')+'">'+t.images.map(i=>'<img src="assets/'+i+'" alt="'+key+'">').join('')+'</div>';let l=document.querySelector('#revealLink');l.hidden=!t.link;if(t.link){l.href=t.link;l.textContent=t.label}reveal.classList.add('active');document.body.style.overflow='hidden';document.querySelector('#close').focus()};function closeTopic(){reveal.classList.remove('active');document.body.style.overflow=''}document.querySelectorAll('.peek').forEach(el=>el.addEventListener('click',()=>openTopic(el.dataset.topic)));document.querySelector('#close').onclick=closeTopic;reveal.addEventListener('click',e=>{if(e.target===reveal)closeTopic()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTopic()});document.querySelector('#portrait').addEventListener('click',()=>document.querySelector('#stage').classList.toggle('show'));

const sendHeight=()=>{const main=document.querySelector('main');if(main)parent.postMessage({type:'clara-about-height',height:Math.ceil(main.getBoundingClientRect().bottom+4)},'*')};window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);
</script></body></html>
